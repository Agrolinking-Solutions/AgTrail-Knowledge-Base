name: Keep API Awake (manual, backup only)

# This used to run on a 10-minute schedule to prevent Render's free tier
# from spinning down. That's now handled by UptimeRobot instead (an
# external monitor pinging /health every 5 minutes), because a private
# GitHub repo only gets 2,000 free Actions minutes a month, and pinging
# every 10 minutes would have used roughly 4,300 minutes a month, well
# over that limit. Once the free quota ran out mid-month, this workflow
# would have silently stopped running (GitHub's default spending limit for
# free accounts is $0), and cold starts would have quietly come back with
# no warning.
#
# Kept here as a manual-only workflow, useful for spot-checking that the
# API is reachable without leaving a browser tab open, but it no longer
# runs automatically.

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://agtrail-api.onrender.com/health)
          echo "Response code: $response"
          if [ "$response" != "200" ]; then
            echo "Health check did not return 200, service may be down or redeploying."
            exit 1
          fi